<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/ui.css">
    <script src="assets/icons.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #14101c; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #root > div[data-composition-src] { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1920" data-height="1080">
      <div id="el-capture" data-composition-id="hero-01-capture" data-composition-src="compositions/hero-01-capture.html" data-start="0" data-duration="5" data-track-index="1"></div>
      <div id="el-record" data-composition-id="hero-02-record" data-composition-src="compositions/hero-02-record.html" data-start="5" data-duration="5" data-track-index="1"></div>
      <div id="el-studio" data-composition-id="hero-03-studio" data-composition-src="compositions/hero-03-studio.html" data-start="10" data-duration="7" data-track-index="1"></div>
      <div id="el-shape" data-composition-id="hero-04-shape" data-composition-src="compositions/hero-04-shape.html" data-start="17" data-duration="4" data-track-index="1"></div>
      <div id="el-export" data-composition-id="hero-05-export" data-composition-src="compositions/hero-05-export.html" data-start="21" data-duration="4" data-track-index="1"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
