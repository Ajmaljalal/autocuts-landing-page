<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <link rel="stylesheet" href="../assets/ui.css" />
    <link rel="stylesheet" href="../assets/stage.css" />
    <script src="../assets/icons.js"></script>
    <script src="../assets/ac-motion.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: #14101c; }
      #root { position: relative; width: 1080px; height: 1080px; overflow: hidden; }
      .pill-host { position: absolute; left: 50%; top: 190px; transform: translateX(-50%) scale(1.3); transform-origin: top center; }
      .ic { width: 19px; height: 19px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="record-anything" data-start="0" data-duration="6.5"
         data-width="1080" data-height="1080">
      <div class="wall ember"></div>
      <div class="ac pill-host">
        <div class="ac-pill">
          <p class="ac-pill-q">What are we capturing?</p>
          <div class="ac-cells">
            <div class="ac-cell" id="c-screen"><svg class="ic"><use href="#i-monitor" /></svg><span>Screen</span></div>
            <span class="ac-divider"></span>
            <div class="ac-cell" id="c-window"><svg class="ic"><use href="#i-app-window" /></svg><span>Window</span></div>
            <span class="ac-divider"></span>
            <div class="ac-cell" id="c-area"><svg class="ic"><use href="#i-crop" /></svg><span>Area</span></div>
            <span class="ac-divider"></span>
            <div class="ac-cell wide" id="c-cam"><svg class="ic"><use href="#i-camera" /></svg><span>FaceTime…</span></div>
            <span class="ac-divider"></span>
            <div class="ac-cell wide" id="c-mic"><svg class="ic"><use href="#i-mic" /></svg><span>MacBook A…</span>
              <span class="ac-mic-level"><i id="mic-i" style="width:32%"></i></span></div>
            <span class="ac-divider"></span>
            <div class="ac-cell wide" id="c-sys"><svg class="ic"><use href="#i-volume-2" /></svg><span>System Audio</span></div>
            <span class="ac-divider"></span>
            <div class="ac-cell muted" id="c-script"><svg class="ic"><use href="#i-scroll-text" /></svg><span>Script</span></div>
            <span class="ac-divider"></span>
            <div class="ac-cell" id="c-set"><svg class="ic"><use href="#i-settings-2" /></svg><span>Settings</span></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const mo = ACMotion({
        frameEl: document.getElementById("root"),
        frameW: 1080, frameH: 1080, canvasW: 1080,
        restX: 620, restY: 640
      });

      const mid = (id) => {
        const r = document.getElementById(id).getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      };

      /* The cursor walks the pill: each source highlights on hover, no clicks, no zoom —
         exactly the screencharm record-anything rhythm. */
      const stops = ["c-screen", "c-window", "c-area", "c-cam", "c-mic", "c-sys"];
      stops.forEach((id, i) => {
        const p = mid(id);
        const arrive = 0.85 + i * 0.88;
        mo.travel(tl, arrive - 0.45, 0.45, p.x, p.y);
        tl.set("#" + id, { className: document.getElementById(id).className + " hot" }, arrive - 0.06);
        tl.set("#" + id, { className: document.getElementById(id).className }, arrive + 0.82 - 0.06);
      });

      /* the sources are buttons: the pointer shows for the whole hover walk */
      mo.pointer(tl, 0.73, true); mo.pointer(tl, 6.12, false);

      /* glide away so the loop closes */
      mo.travel(tl, 6.0, 0.5, 620, 640);

      /* live microphone level, the way the meter breathes while it listens */
      [0.32, 0.54, 0.41, 0.66, 0.48, 0.72, 0.38, 0.58, 0.45, 0.62, 0.35, 0.5, 0.68, 0.44,
       0.57, 0.4, 0.63, 0.49, 0.36, 0.55, 0.46, 0.6, 0.42, 0.52, 0.38, 0.47].forEach((v, i) => {
        tl.to("#mic-i", { width: `${Math.round(v * 100)}%`, duration: 0.22, ease: "power1.inOut" }, i * 0.25);
      });

      window.__timelines["record-anything"] = tl;
    </script>
  </body>
</html>
